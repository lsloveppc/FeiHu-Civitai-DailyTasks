[project]
name = "civitai-daily"
version = "1.0.0"
description = "绯狐C站日常任务 — civitai.red / civitai.com 每日 Buzz 任务一键执行器：CLI + Web 管理面板"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]

[project.scripts]
civitai-daily = "civitai_daily.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["civitai_daily*"]

[tool.setuptools.package-data]
"civitai_daily.web" = ["static/*"]
